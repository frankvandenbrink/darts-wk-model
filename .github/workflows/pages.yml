name: Dashboard (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "resultaten/**"
      - "scripts/bouw_dashboard.py"
      - "README.md"
      - "inhoud/**"
      - "docs/**"
      - "experimenten/**"
      - "src/dartswk/correctscore.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: numpy (voor de correct-score-oddstabel)
        run: pip install numpy
      - name: Dashboard bouwen
        run: python scripts/bouw_dashboard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
