[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dartswk"
version = "0.2.0"
description = "Terugtest van een dartsmodel voor het PDC WK (hobbyproject)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Frank van den Brink" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "requests", "beautifulsoup4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dartswk = "dartswk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
